[package]
name = "pxls_backend"
version = "0.1.0"
description = "Backend for pxls, a dashboard for legacy Divoom Pixoo Bluetooth displays"
edition = "2021"
build = "src/build.rs"

[dependencies]
pixoo = "0.1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33.1"
image = "0.25"
serde_json = "1.0"
bluetooth-serial-port = "0.6"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
urlencoding = "2.1"
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls", "json"] }
ureq = { version = "2.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1.19"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
jsonwebtoken = "9"
sha2 = "0.10"

# argon2 is deliberately slow; unoptimised it makes debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
