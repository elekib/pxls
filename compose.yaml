services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pxls-backend
    network_mode: host
    privileged: true
    env_file:
      - .env
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /dev:/dev
      - ./data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pxls-frontend
    ports:
      - 3030:80
    # The backend runs on the host network; this name resolves to the Docker host on Linux too.
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      - backend
