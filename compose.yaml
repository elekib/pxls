# Run pxls from the published image:
#   cp .env.example .env   # set PIXOO_MAC and TZ
#   docker compose up -d
# To build from source instead, add the build overlay (see compose.build.yaml).
services:
  pxls:
    image: ghcr.io/elekib/pxls:${PXLS_TAG:-latest}
    container_name: pxls
    # Bluetooth sockets only work in the host network namespace.
    network_mode: host
    privileged: true
    env_file:
      - .env
    environment:
      PORT: ${PXLS_PORT:-3500}
    volumes:
      - /dev:/dev
      - ./data:/app/data
    restart: unless-stopped
