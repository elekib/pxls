# Run pxls from the published images:
#   cp .env.example .env   # set TZ
#   docker compose up -d
# To build from source instead, add the build overlay (see compose.build.yaml).
services:
  backend:
    image: ghcr.io/elekib/pxls-backend:${PXLS_TAG:-latest}
    container_name: pxls-backend
    network_mode: host
    privileged: true
    env_file:
      - .env
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /dev:/dev
      - ./data:/app/data
    restart: unless-stopped
  frontend:
    image: ghcr.io/elekib/pxls-frontend:${PXLS_TAG:-latest}
    container_name: pxls-frontend
    ports:
      - 3030:80
    # The backend runs on the host network; this name resolves to the Docker host on Linux too.
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    depends_on:
      - backend
